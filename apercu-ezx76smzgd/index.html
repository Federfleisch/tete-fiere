<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Tête Fière (aperçu privé)</title>
  <style>
    :root { --navy: #110F39; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #8fb4ee url("../assets/main-background.jpg") center / cover no-repeat;
      color: var(--navy);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { display: grid; gap: 1.5rem; justify-items: center; }
    h1 { margin: 0; }
    .logo { width: min(70vw, 520px); height: auto; }
    .tag {
      margin: 0;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      background: #fff;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1><img class="logo" src="../assets/logo-outlined.svg" alt="Tête Fière !" width="958" height="503"></h1>
    <p class="tag">Aperçu privé : version de travail</p>
  </main>
</body>
</html>
