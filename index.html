<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tête Fière</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 0 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      background: #fafafa;
      color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #141414; color: #f2f2f2; }
    }
    h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 0.5rem; }
    p { font-size: 1.25rem; margin: 0; opacity: 0.75; }
  </style>
</head>
<body>
  <main>
    <h1>Tête Fière</h1>
    <p>Notre site arrive bientôt.</p>
  </main>
</body>
</html>
